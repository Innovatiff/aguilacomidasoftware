# Publishes the admin panel on every push.
#
# Deploying the Firestore rules and deploying the app are two different things,
# and getting only one of them is how a fix appears to "not work": the rules
# change but the browser keeps loading the previous build. This job always does
# both, in that order, so the two can never drift apart.
#
# One-time setup — see README, "Publicar desde GitHub":
#   1. Firebase console → Project settings → Service accounts →
#      Generate new private key. A .json file downloads.
#   2. This repo → Settings → Secrets and variables → Actions →
#      New repository secret, named FIREBASE_SERVICE_ACCOUNT,
#      with the whole contents of that file pasted in.

name: Publicar

on:
  push:
    branches:
      - claude/el-aguila-cocina-app-yo40te
    # Documentation changes cannot affect what runs in a browser.
    paths-ignore:
      - '**/*.md'
      - 'tests/**'
  workflow_dispatch:        # lets you publish by hand from the Actions tab

concurrency:
  # A newer push makes an in-flight deploy irrelevant; do not race them.
  group: deploy-admin
  cancel-in-progress: true

jobs:
  publicar:
    name: Reglas y panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: Preparar credenciales
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT. Ver las instrucciones al inicio de este archivo."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      # Rules first. If they are rejected the deploy stops here, which is the
      # right order: an app newer than its rules fails at every write.
      - name: Publicar reglas e índices
        run: firebase deploy --only firestore:rules,firestore:indexes --project aguilacocina-24496 --non-interactive

      - name: Publicar el panel
        run: firebase deploy --only hosting:admin --project aguilacocina-24496 --non-interactive

      - name: Limpiar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
