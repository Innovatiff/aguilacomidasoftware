<!doctype html>
<html lang="es">
<head>
  <!--
    La puerta de la cocina.

    Es index.html con otro nombre, otro icono y data-mode="kitchen". Se instala
    en las dos computadoras donde se empaca: abre directo en "¿Quién eres?", no
    trae la navegación del panel, y en el menú el botón más grande es Empacar.

    Todo lo que está de <body> para abajo es idéntico a index.html a propósito,
    incluido el arranque del service worker. Si se toca uno, se toca el otro.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21262c">
  <meta name="description" content="La libreta de empaque de El Águila Cocina: quién empaca, qué rancho y qué lleva cada persona.">
  <meta name="color-scheme" content="light">

  <title>El Águila · Empaque</title>

  <link rel="manifest" href="./empaque.webmanifest">
  <link rel="icon" href="./assets/empaque.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/empaque-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Empaque">

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/screens.css">
  <link rel="stylesheet" href="./css/pos.css">
  <link rel="stylesheet" href="./css/print.css">
</head>
<body data-mode="kitchen">
  <div id="app"></div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif">
      Esta aplicación necesita JavaScript activado para funcionar.
    </p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
  <script>
    // Progressive enhancement only: the app works without it.
    if ('serviceWorker' in navigator) {
      // Whether a worker was already driving this page. On a first visit there
      // is none, and the handover below is normal rather than an update.
      var hadController = !!navigator.serviceWorker.controller;
      var reloading = false;

      // A new deploy installs a new worker, which takes over immediately
      // (skipWaiting). The page it takes over, though, is still running the
      // code it loaded a moment ago — so reload once and land on the new
      // version. Without this, people sit on a replaced build until they
      // happen to reload, which is exactly how a shipped fix looks like it
      // never happened.
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading || !hadController) return;
        reloading = true;
        window.location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          // Also look for a new version when the app is reopened, not only on
          // a hard refresh.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update();
          });
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
